services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vakaa-backend:latest
    container_name: vakaa-server
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file:
      - apps/server/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      - "3000"
    volumes:
      - vakaa-invoices:/app/apps/server/invoices
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
        reservations:
          cpus: "0.2"
          memory: 400M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - vakaa-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vakaa-backend:latest
    container_name: vakaa-worker
    restart: unless-stopped
    command: ["node", "dist/index-worker.js"]
    env_file:
      - apps/server/.env
    environment:
      - NODE_ENV=production
    volumes:
      - vakaa-invoices:/app/apps/server/invoices
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1500M
        reservations:
          cpus: "0.1"
          memory: 400M
    depends_on:
      server:
        condition: service_healthy
    networks:
      - vakaa-network

  caddy:
    image: caddy:2-alpine
    container_name: vakaa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 150M
    depends_on:
      - server
    networks:
      - vakaa-network

volumes:
  caddy-data:
  caddy-config:
  vakaa-invoices:

networks:
  vakaa-network:
    driver: bridge
